logging.level.org.springframework.security=DEBUG

# ── Database ────────────────────────────────────────────────────────
# Set these via environment variables or a local application-local.properties file
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/greenbuddy}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8082

# ── File upload limits ───────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Folder where uploads/avatars are saved (relative to where the app runs)
upload.dir=uploads

# ── External API Keys ────────────────────────────────────────────────
# Set GEMINI_API_KEY and WEATHER_API_KEY as environment variables
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
weather.api.key=${WEATHER_API_KEY:YOUR_WEATHER_API_KEY}
weather.base.url=https://api.openweathermap.org/data/2.5/weather

# ── JWT ───────────────────────────────────────────────────────────────
# Set JWT_SECRET as environment variable (min 64 chars for HS256)
jwt.secret=${JWT_SECRET:ChangeThisToAStrongRandomSecretKeyAtLeast64CharactersLongForHS256!}

# ── Error Handling ───────────────────────────────────────────────────
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

logging.level.org.springframework.web=INFO
logging.level.org.springframework.http.converter.json=INFO