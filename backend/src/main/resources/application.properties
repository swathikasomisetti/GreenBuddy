# ── File upload limits ──────────────────────────────────────────────
# Allow individual files up to 20 MB and total request up to 25 MB.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
# ── Add these lines to your existing application.properties ──────

# Folder where avatars are saved (relative to where the app runs)
upload.dir=uploads

# Allow large avatar uploads (5 MB max)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
gemini.api.key=YOUR_API_KEY
